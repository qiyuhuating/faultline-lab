name: Verify Faultline
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - name: Core tests with retained raw evidence
        run: |
          set -o pipefail
          mkdir -p test-results/core
          node -p 'JSON.stringify(process.versions, null, 2)' > test-results/core/runtime.json
          node --test --test-reporter=tap tests/*.test.mjs | tee test-results/core/core.tap
      - run: node tools/benchmark.mjs --jobs=500 --output=benchmark-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-evidence
          path: |
            test-results/core/
            benchmark-result.json
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      FAULTLINE_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix tests --ignore-scripts
      - run: cd tests && npx playwright install --with-deps ${{ matrix.browser }}
      - run: node tests/browser.mjs
      - run: node tools/build-showcase.mjs && node tests/showcase.mjs
      - run: cp tests/package-lock.json test-results/${{ matrix.browser }}/dependency-lock.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.browser }}
          path: test-results/
